[workspace]
resolver = "2"
members = [
    "wolf-core",
    "wolf-lua", 
    "wolf-ffi",
    "wolf-server"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
authors = ["The Wolf Project Contributors"]

[workspace.dependencies]
# Core dependencies
thiserror = "2.0"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Lua integration (LuaJIT)
mlua = { version = "0.10", features = ["luajit", "vendored", "send"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Testing
pretty_assertions = "1.4"
